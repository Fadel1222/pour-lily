<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f6f1e8"><title>Pour toi — Une petite clé</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#403b35;font-family:Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:28px 22px}.card{width:min(100%,440px);text-align:center}.monogram{font:24px Georgia,serif;letter-spacing:6px;color:#a65f58}.envelope{width:110px;height:76px;background:#e9d8cd;border:1px solid #d8c5b9;margin:42px auto 32px;position:relative;border-radius:3px;box-shadow:0 8px 25px #403b3510}.flap{position:absolute;inset:0;background:#f5e9e1;clip-path:polygon(0 0,100% 0,50% 64%)}.seal{position:absolute;left:40px;top:34px;border-radius:50%;width:30px;height:30px;background:#a65f58;color:#fff4e8;display:grid;place-items:center;font:22px Georgia,serif}h1{font:normal 39px/1.2 Georgia,serif;letter-spacing:-1px;margin:0 0 22px}h1 em{color:#a65f58}p{color:#80786e;font-size:14px;line-height:1.8;margin:0 auto 28px;max-width:330px}form{text-align:left;margin:30px 0}label{display:block;font-size:12px;margin-bottom:10px}.input-row{display:flex;background:#fffcf6;border:1px solid #d9cfc0;border-radius:4px;overflow:hidden}input{width:100%;min-width:0;border:0;background:transparent;padding:16px;font-size:16px;color:#403b35}input:focus{outline:0}.input-row:focus-within{outline:2px solid #a65f58;outline-offset:3px}button{cursor:pointer;font:inherit}.reveal{background:none;border:0;color:#8b544d;padding:0 14px;font-size:11px}.submit{width:100%;background:#403b35;color:#fffaf2;border:0;border-radius:4px;padding:17px;margin-top:16px;font-size:13px}.submit:hover{background:#82554e}.submit:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:2px solid #a65f58;outline-offset:4px}.error{min-height:24px;color:#a1473d;font-size:12px;line-height:1.7;display:block;margin-top:12px}.note{font:italic 16px/1.8 Georgia,serif;color:#a65f58;margin-top:20px}.foot{border-top:1px solid #ded6c9;padding-top:25px;font-size:11px;color:#91877c} @media(max-width:400px){h1{font-size:34px}.envelope{margin-top:25px}}
</style></head><body><main class="card"><div class="monogram" aria-label="Mohamed et Lily">M ♡ L</div><div class="envelope" aria-hidden="true"><span class="flap"></span><span class="seal">♡</span></div><h1>Un petit endroit,<br>rien qu’à <em>nous.</em></h1><p>Quelques mots t’attendent derrière cette porte.<br>Tu as la petite clé pour les retrouver.</p><form id="unlock-form"><label for="password">Le mot de passe que Mohamed t’a confié</label><div class="input-row"><input id="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="error"><button class="reveal" type="button" aria-pressed="false" aria-controls="password">Afficher</button></div><button class="submit" type="submit">Ouvrir mon petit cadeau →</button><span class="error" id="error" role="status" aria-live="polite"></span></form><p class="note">Prends ton temps. Ces mots sont pour toi.</p><div class="foot">De Mohamed, pour Lily.</div></main><script src="unlock.js?v=1"></script></body></html>
